# cargo-about configuration (this fork, LIC.1): the third-party crate licences compiled into the
# Windows build of pdfcraft.exe and pdfcraft-cli.exe (.github/workflows/overlay-windows.yml).
# Regenerate licenses/THIRD-PARTY-CRATES.txt as described in licenses/README.txt.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# PdfCraft's own workspace crates are covered by LICENSE-MIT, LICENSE-APACHE and NOTICE.
private = { ignore = true }
