[package]
name = "eframe"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "egui framework - write GUI apps that compiles to web and/or natively"
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/emilk/egui/tree/main/crates/eframe"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emilk/egui/tree/main/crates/eframe"
categories = ["gui", "game-development"]
keywords = ["egui", "gui", "gamedev"]
include = ["../../LICENSE-APACHE", "../../LICENSE-MIT", "**/*.rs", "Cargo.toml", "data/icon.png"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--generate-link-to-definition"]

# [lints] workspace = true: dropped, the vendored copy is outside a workspace.

[lib]


[features]
default = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "links",
  "system_fonts",
  "wayland", # Required for Linux support (including CI!)
  "web_screen_reader",
  "wgpu",
  "winit/default",
  "x11",
]

## Enable platform accessibility API implementations through [AccessKit](https://accesskit.dev/).
accesskit = ["egui-winit/accesskit"]

# Allow crates to choose an android-activity backend via Winit
# - It's important that most applications should not have to depend on android-activity directly, and can
#   rely on Winit to pull in a suitable version (unlike most Rust crates, any version conflicts won't link)
# - It's also important that we don't impose an android-activity backend by taking this choice away from applications.

## Enable the `game-activity` backend via `egui-winit` on Android
android-game-activity = ["egui-winit/android-game-activity"]
## Enable the `native-activity` backend via `egui-winit` on Android
android-native-activity = ["egui-winit/android-native-activity"]

## If set, egui will use `include_bytes!` to bundle some fonts.
## If you plan on specifying your own fonts you may disable this feature.
default_fonts = ["egui/default_fonts"]

## Enable experimental egui features that might have massive breaking changes or be removed entirely in future updates.
## Enabling this won't break semver, it's just future compatibility risk.
##
## Currently, this enables the theme plugin.
experimental = ["egui/experimental"]

## Enable [`glow`](https://github.com/grovesNL/glow) for painting, via [`egui_glow`](https://github.com/emilk/egui/tree/main/crates/egui_glow).
##
## There is generally no need to enable both the `wgpu` and `glow` features,
## but if you do you can pick the renderer to use with [`NativeOptions::renderer`]
## and `WebOptions::renderer`.
glow = ["dep:egui_glow", "dep:glow", "dep:glutin-winit", "dep:glutin"]

## Enable saving app state to disk.
persistence = ["egui-winit/serde", "egui/persistence", "ron", "serde"]

## Enables wayland support and fixes clipboard issue.
##
## If you are compiling for Linux (or want to test on a CI system using Linux), you should enable this feature.
wayland = [
  "egui-winit/wayland",
  "egui-wgpu?/wayland",
  "egui_glow?/wayland",
  "glutin?/wayland",
  "glutin-winit?/wayland",
]

## Load system fonts on demand for characters that the installed fonts lack (native only).
##
## Turn it off at runtime with [`NativeOptions::system_font_fallback`].
system_fonts = ["dep:egui_system_font_provider"]

## Enable screen reader support (requires `ctx.options_mut(|o| o.screen_reader = true);`) on web.
##
## For other platforms, use the `accesskit` feature instead.
web_screen_reader = ["web-sys/SpeechSynthesis", "web-sys/SpeechSynthesisUtterance"]

## Enable [`wgpu`](https://docs.rs/wgpu) for painting (via [`egui-wgpu`](https://github.com/emilk/egui/tree/main/crates/egui-wgpu)).
##
## There is generally no need to enable both the `wgpu` and `glow` features,
## but if you do you can pick the renderer to use with [`NativeOptions::renderer`]
## and `WebOptions::renderer`.
##
## Switching from `wgpu (the default)` to `glow` can significantly reduce your binary size
## (including the .wasm of a web app).
## See <https://github.com/emilk/egui/issues/5889> for more details.
##
## By default, eframe will prefer WebGPU over WebGL, but
## you can configure this at run-time with `WebOptions::wgpu_options`.
wgpu = ["wgpu_no_default_features", "egui-wgpu/default"]

## This is exactly like the `wgpu` feature, but does NOT enable the default features of `wgpu` and `egui-wgpu`.
##
## This means that no `wgpu` backends are enabled. You will need to enable them yourself, e.g. like this:
##
## ```toml
## wgpu = { version = "*", features = ["dx12", "metal", "webgl"] }
## ```
wgpu_no_default_features = ["dep:wgpu", "dep:egui-wgpu", "dep:pollster"]

## Enables compiling for x11.
x11 = [
  "egui-winit/x11",
  "egui-wgpu?/x11",
  "egui_glow?/x11",
  "glutin?/x11",
  "glutin?/glx",
  "glutin-winit?/x11",
  "glutin-winit?/glx",
]

## If set, eframe will look for the env-var `EFRAME_SCREENSHOT_TO` and write a screenshot to that location, and then quit.
## This is used to generate images for examples.
__screenshot = []

## Enable the [`egui_inspection`] plugin. When the `EGUI_INSPECTION` (or
## `EGUI_INSPECTION_ADDR`) env var is set, eframe opens a TCP inspection port on startup that
## lets an external tool (e.g. the `egui_mcp` server) read the AccessKit tree, inject input,
## and capture screenshots. Off unless the env var is set; no-op on wasm.
inspection = ["dep:egui_inspection", "accesskit"]

## Enables the `links` feature on `egui-winit`, allowing for links to open in browser.
links = ["egui-winit/links"]

## Enables the `clipboard` feature on `egui-winit`, allowing to cut/copy/paste to OS clipboard.
## If disabled a clipboard will be simulated so you can still copy/paste within the egui app.
clipboard = ["egui-winit/clipboard", "egui-winit/clipboard-image"]

[dependencies]
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }

ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
document-features = { version = "0.2.12" }
log = { version = "0.4.34", features = ["std"] }
parking_lot = { version = "0.12.5" }
profiling = { version = "1.0", default-features = false }
raw-window-handle = { version = "0.6.2" }
static_assertions = { version = "1.1" }
web-time = { version = "1.1" }

# Optional dependencies

egui_glow = { version = "0.37.0", default-features = false, optional = true }
egui_inspection = { version = "0.37.0", default-features = false, optional = true, features = ["plugin"] }
glow = { version = "0.17.0", optional = true }
ron = { version = "0.12.2", optional = true, features = ["integer128"] }
serde = { version = "1.0", features = ["derive"], optional = true }

# -------------------------------------------
# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] } # Needed for app icon
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

# optional native:
egui_system_font_provider = { version = "0.37.0", default-features = false, optional = true }
egui-wgpu = { version = "0.37.0", default-features = false, optional = true, features = [
  "winit",
  "capture",
] } # if wgpu is used, use it with winit
pollster = { version = "1.0", optional = true } # needed for wgpu

glutin = { version = "0.32.3", default-features = false, optional = true, features = ["egl", "wgl"] }
glutin-winit = { version = "0.5.0", default-features = false, optional = true, features = [
  "egl",
  "wgl",
] }

# mac:
[target.'cfg(any(target_os = "macos"))'.dependencies]
objc2 = { version = "0.6.4" }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSData",
  "NSString",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

# windows:
[target.'cfg(any(target_os = "windows"))'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# -------------------------------------------
# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25" }
egui = { version = "0.37.0", default-features = false, features = ["web_file"] }
image = { version = "0.25.10", default-features = false, features = ["png"] } # For copying images
js-sys = { version = "0.3.103" }
percent-encoding = { version = "2.3" }
send_wrapper = { version = "0.6" }
wasm-bindgen = { version = "0.2.126" }
web-sys = { version = "0.3.103", features = [
  "AddEventListenerOptions",
  "BinaryType",
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CanvasRenderingContext2d",
  "CompositionEvent",
  "console",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DragEvent",
  "Element",
  "Event",
  "EventListener",
  "EventTarget",
  "ExtSRgb",
  "File",
  "FileList",
  "FocusEvent",
  "FocusOptions",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "InputEvent",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "ShadowRoot",
  "Storage",
  "TextMetrics",
  "Touch",
  "TouchEvent",
  "PointerEvent",
  "TouchList",
  "WebGl2RenderingContext",
  "WebglDebugRendererInfo",
  "WebGlRenderingContext",
  "WheelEvent",
  "Window",
] }

# optional web:
egui-wgpu = { version = "0.37.0", default-features = false, optional = true, features = [
  # if wgpu is used, use it without (!) winit:
  "capture",
] }
wgpu = { version = "30.0", default-features = false, features = ["std"], optional = true }

# Native dev dependencies for testing
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
directories = { version = "6.0" }

# Browser regression tests use the CLI matching the workspace wasm-bindgen version.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
