name: Forgejo HTTP diagnostic (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'sefr-14/pdfcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unauthenticated Forgejo API response
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          url = (
              'https://git.ferrive.me/api/v1/repos/sefr/pdfcraft/pulls'
              '?state=all&sort=oldest&page=1&limit=50'
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'pdfcraft-http-diagnostic/1',
              },
          )

          try:
              try:
                  response = opener.open(request, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error

              with response:
                  body = response.read(1024 * 1024 + 1)
                  content_type = response.headers.get('Content-Type', '(absent)')
                  location = response.headers.get('Location')
                  print('HTTP status:', response.status)
                  print('Content-Type:', content_type)
                  print('Body size:', f'{len(body)} bytes (capped at 1 MiB)')
                  print('Response truncated:', len(body) > 1024 * 1024)
                  print('Redirect present:', bool(location))
                  if location:
                      host = urllib.parse.urlsplit(
                          urllib.parse.urljoin(url, location)
                      ).hostname
                      print('Redirect hostname:', host or '(absent)')
                  try:
                      json.loads(body.decode('utf-8'))
                      print('Valid JSON:', True)
                  except (UnicodeDecodeError, ValueError):
                      print('Valid JSON:', False)
                  print('Appears HTML:', body.lstrip().lower().startswith(
                      (b'<!doctype html', b'<html')
                  ))
          except urllib.error.URLError as error:
              print('Network error type:', type(error.reason).__name__)
              raise SystemExit(1)
          PY
