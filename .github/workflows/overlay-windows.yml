# Scratch-only Windows feasibility workflow for TAB.WINDOW.1 W0; not for Main.
#
# This copy of the fork's Windows workflow, on scratch/tab-window-w0 only, builds the disposable
# W0 spike (w0-spike/) instead of the app, as a test package for Windows. GitHub runs the copy of
# a workflow_dispatch workflow at the ref the run is dispatched on, and this file name exists on
# the default branch, so dispatching on scratch/tab-window-w0 runs this file. Main's
# overlay-windows.yml is a different file and is not changed by this branch.
#
# - Builds w0-spike (its own Cargo.lock and empty [workspace]) for x86_64-pc-windows-msvc.
# - No secrets; read-only token; no tag, no release. The artifact holds the spike exe, the
#   windows/ test scripts and docs, and a SHA-256 file.
# - Then runs the checks unattended on this runner (windows\run.ps1 -SkipManual -Unattended), once
#   per renderer, and uploads the results (CSV, logs, screenshots) as a second artifact. Every row
#   is labelled with where it ran (ci-vm: a GitHub virtual machine with injected input and software
#   rendering), so none of it stands in for a test on physical Windows hardware.
# - glow needs OpenGL 3, which the runner has no driver for: it runs with Mesa's llvmpipe
#   (pal1000/mesa-dist-win, MIT), downloaded at a pinned release, checked against the SHA-256
#   digest GitHub publishes for that asset, put next to a copy of the exe and never packaged.

name: overlay windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows-x64:
    name: Windows x64 (W0 spike)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: w0-spike-windows-x64
          workspaces: w0-spike -> target

      - name: Name this build
        id: name
        shell: bash
        run: echo "package=w0-spike-${GITHUB_SHA::7}-windows-x64" >>"$GITHUB_OUTPUT"

      - name: Build the spike
        shell: bash
        working-directory: w0-spike
        run: cargo build --release --locked --bins --target "$TARGET"

      # With --target, Cargo writes the exe under target\<triple>\release, not target\release.
      # It opens windows, so it is not run here; check it is there and plausibly complete.
      - name: Check the built exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "w0-spike\target\$env:TARGET\release\w0-spike.exe"
          if (-not (Test-Path -PathType Leaf $exe)) { throw "w0-spike.exe missing at $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "w0-spike.exe is only $size bytes" }
          "w0-spike.exe: $size bytes at $exe"

      # The test scripts can't be parsed on the Linux machine that wrote them: parse them here
      # with Windows PowerShell's own parser, so a syntax error fails the build, not the test run.
      - name: Parse the test scripts
        shell: powershell
        working-directory: w0-spike\windows
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
            "$($f.Name): $($errors.Count) parse error(s)"
          }
          if ($bad -gt 0) { throw "$bad parse error(s) in the test scripts" }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "dist\$env:PACKAGE"
          # Built at target\<triple>\release; packaged at target\release, where
          # windows\run.ps1 looks (<package>\target\release\w0-spike.exe).
          $built = "w0-spike\target\$env:TARGET\release\w0-spike.exe"
          New-Item -ItemType Directory -Force -Path "$dir\target\release" | Out-Null
          Copy-Item $built "$dir\target\release\w0-spike.exe"
          Copy-Item -Recurse w0-spike\windows "$dir\windows"
          Copy-Item w0-spike\W0-REPORT.md, LICENSE-MIT, LICENSE-APACHE $dir
          "commit $env:GITHUB_SHA" | Set-Content -Encoding ascii "$dir\COMMIT.txt"
          # Every file the Windows run needs must be there and non-empty before zipping.
          $required = @('target\release\w0-spike.exe', 'windows\run.ps1', 'windows\collect.ps1',
                        'windows\build.ps1', 'windows\CHECKLIST.md', 'windows\README.md',
                        'W0-REPORT.md', 'LICENSE-MIT', 'LICENSE-APACHE', 'COMMIT.txt')
          foreach ($f in $required) {
            $p = Join-Path $dir $f
            if (-not (Test-Path -PathType Leaf $p)) { throw "package is missing $f" }
            if ((Get-Item $p).Length -le 0) { throw "package file $f is empty" }
          }
          Compress-Archive -Path $dir -DestinationPath "dist\$env:PACKAGE.zip" -Force
          # Reopen the zip and check the same files are inside it, under the package folder.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$env:PACKAGE.zip"))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            foreach ($f in $required) {
              $want = "$env:PACKAGE/" + ($f -replace '\\', '/')
              if ($names -notcontains $want) { throw "zip is missing $want" }
            }
          } finally { $zip.Dispose() }
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$env:PACKAGE.zip").Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE.zip" | Set-Content -Encoding ascii "dist\$env:PACKAGE.zip.sha256"
          "SHA-256 $hash  $env:PACKAGE.zip"

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: |
            dist/${{ steps.name.outputs.package }}.zip
            dist/${{ steps.name.outputs.package }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Fetch Mesa llvmpipe for glow (runner only, never packaged)
        id: mesa
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MESA_TAG: '26.2.5'
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = gh api "repos/pal1000/mesa-dist-win/releases/tags/$env:MESA_TAG" | ConvertFrom-Json
          $asset = @($rel.assets | Where-Object { $_.name -match '^mesa3d-.*-release-msvc\.7z$' })
          if ($asset.Count -ne 1) { throw "expected one MSVC release asset, found: $($rel.assets.name -join ', ')" }
          $a = $asset[0]
          if (-not $a.digest) { throw "$($a.name) has no published digest to check it against; not using it" }
          Invoke-WebRequest -Uri $a.browser_download_url -OutFile mesa.7z
          $hash = (Get-FileHash -Algorithm SHA256 mesa.7z).Hash.ToLowerInvariant()
          "Mesa $env:MESA_TAG $($a.name): SHA-256 $hash; GitHub digest $($a.digest)"
          if ($a.digest -ne "sha256:$hash") { throw "SHA-256 mismatch: $hash vs $($a.digest)" }
          7z x mesa.7z -omesa x64\opengl32.dll x64\libgallium_wgl.dll -y | Out-Null
          New-Item -ItemType Directory -Force -Path dist\glow | Out-Null
          Copy-Item "dist\$env:PACKAGE\target\release\w0-spike.exe" dist\glow
          Copy-Item mesa\x64\opengl32.dll, mesa\x64\libgallium_wgl.dll dist\glow
          Get-ChildItem dist\glow | ForEach-Object { "$($_.Name) $((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())" }

      - name: Run the W0 checks unattended (wgpu)
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "dist\$env:PACKAGE\windows\run.ps1" -SkipManual -Unattended -Renderers wgpu -Evidence ci-vm

      - name: Run the W0 checks unattended (glow)
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          $exe = 'dist\glow\w0-spike.exe'; $ev = 'ci-vm/mesa-llvmpipe'
          if (-not (Test-Path $exe)) { $exe = "dist\$env:PACKAGE\target\release\w0-spike.exe"; $ev = 'ci-vm/no-opengl3-driver' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "dist\$env:PACKAGE\windows\run.ps1" -SkipManual -Unattended -Renderers glow -Exe (Resolve-Path $exe).Path -Evidence $ev

      - name: Summarise the results
        if: always()
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $csvs = @(Get-ChildItem -Recurse -Filter results.csv "dist\$env:PACKAGE\windows\w0-results" -ErrorAction SilentlyContinue)
          if ($csvs.Count -eq 0) { "No results were written."; exit 0 }
          $rows = @($csvs | ForEach-Object { Import-Csv $_.FullName })
          $sum = @('## W0 unattended checks', '', '| outcome | rows |', '|---|---|')
          $sum += $rows | Group-Object outcome | ForEach-Object { "| $($_.Name) | $($_.Count) |" }
          $sum += '', '| check | renderer | attempt | outcome | evidence | details |', '|---|---|---|---|---|---|'
          $sum += $rows | Where-Object { $_.outcome -ne 'INFO' -or $_.check -like 'probe_*' } | ForEach-Object { "| $($_.check) | $($_.renderer) | $($_.attempt) | $($_.outcome) | $($_.evidence) | $(($_.details -replace '\|', '/').Substring(0, [math]::Min(160, $_.details.Length))) |" }
          $sum | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          $sum | Select-Object -First 12

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-results-${{ steps.name.outputs.package }}
          path: dist/${{ steps.name.outputs.package }}/windows/w0-results
          if-no-files-found: warn
          retention-days: 14
