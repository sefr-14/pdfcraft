# Fork-only workflow (sefr-14/pdfcraft): build the overlay-compare version of PdfCraft for
# 64-bit Windows as a downloadable Actions artifact.
#
# - Runs only on demand (Actions tab > "overlay windows build" > Run workflow, normally on
#   claude/beautiful-einstein-5zy5wn). A push builds nothing.
# - Builds with the MSVC toolchain, as upstream's release.yml does, but unsigned, without the
#   MSI installer and without the OCR models.
# - Runs the tests of the crates this fork changes before packaging; a failure uploads nothing.
# - Uploads the portable zip and its SHA-256 as an artifact of the run. It creates no tag and no
#   release (OV1.5); the overlay-* pre-releases came from earlier versions of this workflow.
#   Nothing compiled is ever committed to git.
# - The ArtCraft marks are left out of this build (crates/ui-egui/src/widgets.rs), as the
#   ArtCraft brand licence (docs/brand/LICENSE-brand.txt) requires for published modified versions.

name: overlay windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TARGET: x86_64-pc-windows-msvc
  # The crates this fork changes; their tests must pass before a build is uploaded.
  # Later overlay steps add their crates here.
  TEST_PACKAGES: -p pdfcraft-ui-egui -p pdfcraft-overlay

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: overlay-windows-x64

      # The icon and version resources are required, as in upstream's Windows CI.
      - name: Require Windows executable resources
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'PDFCRAFT_REQUIRE_WINRES=1'

      - name: Name this build
        id: name
        shell: bash
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          short="${GITHUB_SHA::7}"
          echo "package=pdfcraft-overlay-$version-$short-windows-x64-portable" >>"$GITHUB_OUTPUT"

      - name: Test the changed crates
        shell: bash
        run: |
          # TEST_PACKAGES holds several "-p crate" arguments; split it into an array, not by globbing.
          read -ra packages <<<"$TEST_PACKAGES"
          cargo test --locked "${packages[@]}"

      - name: Build
        shell: bash
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target "$TARGET"

      - name: Smoke test
        shell: pwsh
        run: |
          & "target\$env:TARGET\release\pdfcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "pdfcraft-cli --version failed with exit code $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target\$env:TARGET\release"
          $dir = "dist\$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$bin\pdfcraft.exe", "$bin\pdfcraft-cli.exe" $dir
          # portable.txt beside pdfcraft.exe keeps settings, logs and recovery files in
          # PdfCraftData\ next to the exe instead of %APPDATA%.
          Copy-Item packaging\windows\portable.txt $dir
          # Licences and notices the binaries need.
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'README.md') { Copy-Item $f $dir }
          Copy-Item assets\app-icon\LICENSE-document.txt $dir
          Compress-Archive -Path $dir -DestinationPath "dist\$env:PACKAGE.zip" -Force
          Get-Item "dist\$env:PACKAGE.zip" | Format-Table Name, Length

      # The zip and its checksum go to the run's artifacts, never to a release.
      - name: Checksum for the artifact
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$env:PACKAGE.zip").Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE.zip" | Set-Content -Encoding ascii "dist\$env:PACKAGE.zip.sha256"
          "SHA-256 $hash  $env:PACKAGE.zip"

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: |
            dist/${{ steps.name.outputs.package }}.zip
            dist/${{ steps.name.outputs.package }}.zip.sha256
          if-no-files-found: error
