# SCRATCH-BRANCH ONLY (scratch/tab-window-w0), never on Main: this copy of the fork's Windows
# workflow builds the disposable TAB.WINDOW.1 W0 spike (w0-spike/) instead of the app, so the
# owner can dispatch it on the scratch branch and download a test package. GitHub runs the copy
# of a workflow_dispatch workflow at the ref the run is dispatched on, and this file name exists
# on the default branch, so dispatching on scratch/tab-window-w0 runs this file.
# Main's overlay-windows.yml is unchanged. The owner approved this change in its own commit.
#
# - Builds w0-spike (its own Cargo.lock and empty [workspace]) for x86_64-pc-windows-msvc.
# - No secrets; read-only token; no tag, no release. The artifact holds the spike exe, the
#   windows/ test scripts and docs, and a SHA-256 file.

name: overlay windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows-x64:
    name: Windows x64 (W0 spike)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: w0-spike-windows-x64
          workspaces: w0-spike -> target

      - name: Name this build
        id: name
        shell: bash
        run: echo "package=w0-spike-${GITHUB_SHA::7}-windows-x64" >>"$GITHUB_OUTPUT"

      - name: Build the spike
        shell: bash
        working-directory: w0-spike
        run: cargo build --release --locked --bins --target "$TARGET"

      - name: Check the exe exists (it opens windows, so it is not run here)
        shell: pwsh
        working-directory: w0-spike
        run: |
          if (-not (Test-Path "target\$env:TARGET\release\w0-spike.exe")) { throw 'w0-spike.exe missing' }

      # The test scripts can't be parsed on the Linux machine that wrote them: parse them here
      # with Windows PowerShell's own parser, so a syntax error fails the build, not the test run.
      - name: Parse the test scripts
        shell: powershell
        working-directory: w0-spike\windows
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
            "$($f.Name): $($errors.Count) parse error(s)"
          }
          if ($bad -gt 0) { throw "$bad parse error(s) in the test scripts" }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "dist\$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path "$dir\target\release" | Out-Null
          Copy-Item "w0-spike\target\$env:TARGET\release\w0-spike.exe" "$dir\target\release\"
          Copy-Item -Recurse w0-spike\windows "$dir\windows"
          Copy-Item w0-spike\W0-REPORT.md, LICENSE-MIT, LICENSE-APACHE $dir
          "commit $env:GITHUB_SHA" | Set-Content -Encoding ascii "$dir\COMMIT.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\$env:PACKAGE.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$env:PACKAGE.zip").Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE.zip" | Set-Content -Encoding ascii "dist\$env:PACKAGE.zip.sha256"
          "SHA-256 $hash  $env:PACKAGE.zip"

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: |
            dist/${{ steps.name.outputs.package }}.zip
            dist/${{ steps.name.outputs.package }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
