name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    # This fork (sefr-14/pdfcraft): upstream's analysis, with upstream's secrets and SonarCloud
    # project; it runs only there, so the fork's PRs don't carry a check that can't pass.
    if: github.repository == 'storytold/pdfcraft'
    # Tracked at @main so org-wide CI improvements propagate without PR churn.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@main
    secrets: inherit
