     contributors, MIT OR Apache-2.0. No fonts, no traced or third-party shapes. See LICENSE.txt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0F3D6E"/>
    <!-- The other revision, offset behind the sheet. -->
    <rect x="140" y="60" width="300" height="340" rx="12" fill="none" stroke="#E8743B" stroke-width="28"/>
    <!-- The sheet. -->
    <rect x="84" y="112" width="300" height="340" rx="12" fill="#FFFFFF"/>
    <!-- Part outline with a hole: heavier strokes so it survives at 16 px. -->
    <g fill="none" stroke="#0F3D6E" stroke-width="28" stroke-linejoin="round">
      <rect x="130" y="236" width="208" height="104"/>
      <circle cx="234" cy="288" r="22"/>
    </g>
    <!-- Dimension line: ticks, line and large arrowheads. -->
    <g stroke="#E8743B" stroke-width="22" stroke-linecap="round">
      <path d="M130 150 V208 M338 150 V208 M180 179 H288"/>
    </g>
    <path d="M128 179 L188 148 V210 Z M340 179 L280 148 V210 Z" fill="#E8743B"/>
    <!-- Title block: a solid band with one rule, which reads as a block when small. -->
    <rect x="252" y="368" width="114" height="66" fill="#0F3D6E"/>
    <path d="M252 401 H366" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>
