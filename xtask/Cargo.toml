[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-oracle = { workspace = true }
pdfcraft-cos = { workspace = true }
anyhow = "1"
lopdf = "0.45"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
# The demo-PDF time stamp goes through chrono (no hand-rolled calendar code).
chrono = { workspace = true }
# overlay-publish (UPD.1): the owner signs an approved Windows build with the app's own validator.
pdfcraft-overlay-update = { workspace = true, features = ["install"] }
ed25519-dalek = "3.0.0"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { workspace = true }
getrandom = "0.3"
