[package]
name = "pdfcraft-overlay"
description = "Overlay comparison for PdfCraft (fork): page frames, sheet-size proposals, registration, placement and compositing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Appearances for comments without one (step 4, OV4.4).
pdfcraft-annot = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-cos = { workspace = true }
# The PCUndrawn mark on appearances drawn with `?` (O15).
pdfcraft-fonts = { workspace = true }
# Form field appearances from their values (O8).
pdfcraft-forms = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-organize = { workspace = true }

[dev-dependencies]
# Renders overlays in process for the pixel tests and checks the vendored mask fix (step 3).
pdfcraft-render = { workspace = true }
